<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایشگر اسناد کتابخانه ملی</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Segoe UI, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      direction: ltr;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #059669;
    }

    .btn-secondary:hover {
      background-color: #047857;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .page-indicator {
      font-weight: bold;
      padding: 0 10px;
      min-width: 90px;
      text-align: center;
    }

    .image-container {
      text-align: center;
      margin-top: 20px;
      background: #f1f5f9;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .error {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 6px;
    }

    .link-info {
      font-size: 0.8rem;
      color: #64748b;
      word-break: break-all;
      margin-top: 12px;
      text-align: center;
      direction: ltr;
    }

    .link-info a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>نمایشگر و مرورگر اسناد کتابخانه ملی</h1>

      <div class="input-group">
        <input type="text" id="urlInput" placeholder="لینک ImageForm را وارد کنید..." />
        <button onclick="loadDocument()">بارگذاری</button>
      </div>
      <div id="errorMsg" class="error"></div>

      <div id="viewerSection" style="display: none;">
        <div class="controls">
          <div class="nav-buttons">
            <button id="prevBtn" onclick="changePage(-1)">صفحه قبلی (Back)</button>
            <span class="page-indicator">صفحه <span id="pageDisplay">1</span></span>
            <button id="nextBtn" onclick="changePage(1)">صفحه بعدی (Next)</button>
          </div>
          <button class="btn-secondary" onclick="openInNewTab()">باز کردن عکس در تب جدید ↗</button>
        </div>

        <div class="image-container">
          <img id="docImage" src="" alt="در حال بارگذاری صفحه سند..." />
        </div>

        <div class="link-info" id="directLink"></div>
      </div>
    </div>
  </div>

  <script>
    let currentId = '';
    let currentPage = 1;

    // استخراج آی‌دی از لینک ورودی
    function extractId(url) {
      try {
        const urlObj = new URL(url.trim());
        const params = new URLSearchParams(urlObj.search);
        return params.get('ID') || params.get('id') || params.get('cid');
      } catch (e) {
        return null;
      }
    }

    // ساخت آدرس جدید DisplayImage
    function buildImageUrl(id, page) {
      return `https://dl.nlai.ir/UI/Forms/DisplayImage.aspx?id=${id}&db=false&pn=${page}&cid=${id}`;
    }

    // بارگذاری اولیه سند
    function loadDocument() {
      const input = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.innerText = '';

      const extractedId = extractId(input);
      if (!extractedId) {
        errorDiv.innerText = 'شناسه (ID) معتبر از لینک استخراج نشد. لطفاً آدرس را بررسی کنید.';
        return;
      }

      currentId = extractedId;
      currentPage = 1;
      updateViewer();
      document.getElementById('viewerSection').style.display = 'block';
    }

    // تغییر صفحه (Next/Back)
    function changePage(delta) {
      if (currentPage + delta < 1) return;
      currentPage += delta;
      updateViewer();
    }

    // به‌روزرسانی تصویر و دکمه‌ها
    function updateViewer() {
      const imgUrl = buildImageUrl(currentId, currentPage);
      const imgElem = document.getElementById('docImage');
      const pageDisp = document.getElementById('pageDisplay');
      const prevBtn = document.getElementById('prevBtn');
      const directLink = document.getElementById('directLink');

      imgElem.src = imgUrl;
      pageDisp.innerText = currentPage;
      prevBtn.disabled = currentPage <= 1;
      directLink.innerHTML = `آدرس تصویر جاری: <a href="${imgUrl}" target="_blank">${imgUrl}</a>`;
    }

    // باز کردن تصویر فعلی در تب جدید
    function openInNewTab() {
      if (!currentId) return;
      const imgUrl = buildImageUrl(currentId, currentPage);
      window.open(imgUrl, '_blank');
    }
  </script>

</body>
</html>
